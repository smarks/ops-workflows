name: Blue/green deploy

on:
  workflow_call:
    inputs:
      app-dir:
        description: "Absolute path of the app checkout on the deploy host (e.g. /home/sam/dev/tarmar-studio)"
        required: true
        type: string
      command:
        description: "Optional deploy.sh subcommand: '', 'rollback', or 'status'. Empty = normal deploy."
        required: false
        type: string
        default: ""
      host:
        description: "SSH host to deploy to"
        required: false
        type: string
        default: roots.origamisoftware.com
      user:
        description: "SSH user on the deploy host"
        required: false
        type: string
        default: sam
    secrets:
      ssh-key:
        description: "Private SSH key authorized on the deploy host"
        required: true

concurrency:
  group: deploy-${{ inputs.app-dir }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ssh-key }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Transient runner DNS failures have flaked real deploys
          # (tarmar-studio#212): retry the two network-only steps with
          # backoff. deploy.sh itself is deliberately NOT retried -- a
          # blue-green deploy that failed midway needs eyes, not a rerun.
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -H "${{ inputs.host }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan attempt $attempt failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          grep -q . ~/.ssh/known_hosts

      - name: Verify SSH connectivity (retried)
        run: |
          for attempt in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
                "${{ inputs.user }}@${{ inputs.host }}" true; then
              exit 0
            fi
            echo "connect attempt $attempt failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "could not reach ${{ inputs.host }} after 5 attempts" >&2
          exit 1

      - name: Run deploy.sh on host
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              "${{ inputs.user }}@${{ inputs.host }}" \
              "cd '${{ inputs.app-dir }}' && ./deploy.sh ${{ inputs.command }}"
